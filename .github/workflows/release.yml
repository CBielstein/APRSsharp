name: release

on:
  release:
    types:
      - created

jobs:
  release:
    name: release
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: DotnetVersion
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore
      
      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack AprsSharp.AprsParser
        run: dotnet pack src/AprsParser/AprsParser.csproj --configuration Release --no-build

      - name: Pack AprsSharp.AprsIsClient
        run: dotnet pack src/AprsIsClient/AprsIsClient.csproj --configuration Release --no-build

      - name: Pack AprsSharp.KissTnc
        run: dotnet pack src/KissTnc/KissTnc.csproj --configuration Release --no-build

      - name: Pack AprsSharp.Shared
        run: dotnet pack src/Shared/Shared.csproj --configuration Release --no-build

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish AprsSharp.AprsParser
        run: dotnet nuget push src/AprsParser/bin/Release/AprsSharp.AprsParser.*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

      - name: Publish AprsSharp.AprsIsClient
        run: dotnet nuget push src/AprsIsClient/bin/Release/AprsSharp.AprsIsClient.*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

      - name: Publish AprsSharp.KissTnc
        run: dotnet nuget push src/KissTnc/bin/Release/AprsSharp.KissTnc.*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

      - name: Publish AprsSharp.Shared
        run: dotnet nuget push src/Shared/bin/Release/AprsSharp.Shared.*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
